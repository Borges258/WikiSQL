spring:
  application:
    name: dataTesting-core
  profiles:
    active: prod
  main:
    allow-bean-definition-overriding: true

# Single-table Agent settings. Keep credentials outside source control.
agent:
  llm:
    base-url: ${AGENT_LLM_BASE_URL:}
    api-key: ${AGENT_LLM_API_KEY:}
    model: ${AGENT_LLM_MODEL:}
    reasoning-effort: ${AGENT_LLM_REASONING_EFFORT:high}
  single-table:
    name: ${AGENT_SINGLE_TABLE_NAME:}
    max-rows: ${AGENT_SINGLE_TABLE_MAX_ROWS:100}
    query-timeout-seconds: ${AGENT_SINGLE_TABLE_QUERY_TIMEOUT_SECONDS:10}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

logging:
  level:
    com.horsecoder.common.whuTalent: debug
